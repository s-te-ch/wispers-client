name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libclang-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libclang-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install protoc --yes
          choco install nasm --yes

      - name: Set LIBCLANG_PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\lib" >> $env:GITHUB_ENV

      # wconnect depends on `daemonize` which is Unix-only
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cargo build --workspace --all-targets --exclude wconnect

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: cargo build --all-targets

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: cargo test --workspace --exclude wconnect

      - name: Test (Unix)
        if: runner.os != 'Windows'
        run: cargo test

  # All wrapper/example jobs below need the cdylib (libwispers_connect.so/.dylib),
  # so they build it first, then test the language-specific wrapper against it.

  ffi:
    name: C FFI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libclang-dev

      - name: Build cdylib
        run: cargo build -p wispers-connect

      - name: Run C FFI tests
        working-directory: wispers-connect/tests/c_ffi
        run: make test

      - name: Build C example
        working-directory: examples/c
        run: make

  go:
    name: Go wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libclang-dev

      - name: Build cdylib
        run: cargo build -p wispers-connect

      - name: Test Go wrapper
        working-directory: wrappers/go
        env:
          CGO_CFLAGS: -I${{ github.workspace }}/wispers-connect/include
          CGO_LDFLAGS: -L${{ github.workspace }}/target/debug -lwispers_connect
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug
        run: go test -v ./...

      - name: Build Go example
        working-directory: examples/go
        run: make

  bazel:
    name: Bazel module (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libclang-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      # bazelisk is preinstalled on the hosted runners and reads
      # .bazelversion. The native library is built from this tree with cargo:
      # the prebuilt archives pinned in MODULE.bazel belong to the last
      # release, so they lack any C API added since and can't link against
      # the wrapper sources here. The prebuilt path is checked per release by
      # verify-bazel-prebuilt.yml instead. Windows is only checked there,
      # because cargo mode supports the host toolchain only and Bazel's Go on
      # Windows uses MinGW.
      - name: Build and test through Bazel
        run: |
          bazel test //wrappers/go:go_test --@wispers_connect//bazel:native=cargo
          bazel build //examples/go:wconnect-go --@wispers_connect//bazel:native=cargo

      # proto_library makes Bazel compile protoc from source, which takes
      # minutes. The descriptors are platform-independent, so one OS suffices.
      # Same flag as above, or Bazel would discard its analysis cache.
      - name: Build proto targets through Bazel
        if: runner.os == 'Linux'
        run: bazel build //wispers-connect/proto:all --@wispers_connect//bazel:native=cargo

  python:
    name: Python wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libclang-dev

      - name: Build cdylib
        run: cargo build -p wispers-connect

      - name: Install Python test dependencies
        run: pip install pytest
        working-directory: wrappers/python

      - name: Run Python tests
        working-directory: wrappers/python
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug
          PYTHONPATH: ${{ github.workspace }}/wrappers/python
        run: pytest tests/

  # The Kotlin wrapper's unit tests are pure host-JVM tests: they exercise the
  # Kotlin/JNA marshalling layer (via JNA's own libjnidispatch) and never load
  # the Rust cdylib, so this job needs only a JDK + the Android SDK — no Rust
  # toolchain, cdylib, or submodules.
  kotlin:
    name: Kotlin wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The default packages include the legacy `tools`, which current
      # cmdline-tools no longer provide. The build only needs the SDK platform
      # already on the runner.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Run Kotlin wrapper unit tests
        working-directory: wrappers/kotlin
        run: ./gradlew testDebugUnitTest --console=plain --stacktrace

  # The Swift wrapper has no test suite, so CI guards the one thing that rots:
  # whether the Swift sources still compile against the current C ABI. The
  # `-I` header is a symlink to the canonical wispers-connect/include header,
  # so this type-checks against the live ABI (no xcframework, no Rust, no link).
  # It's iOS-only, so it needs an Xcode/macOS runner and an iOS-simulator target.
  swift:
    name: Swift wrapper
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Type-check Swift wrapper against the current C ABI
        working-directory: wrappers/swift
        run: |
          xcrun -sdk iphonesimulator swiftc -typecheck \
            -target arm64-apple-ios15.0-simulator \
            -I Sources/CWispersConnect/include \
            Sources/WispersConnect/*.swift
